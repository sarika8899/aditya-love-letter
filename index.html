<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Aditya 💖</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ffd6e1, #ffb7c5);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #login, #main {
      width: min(92vw, 900px);
      padding: 24px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      backdrop-filter: blur(4px);
    }
    #main { display: none; }
    h1, h2 { margin-top: 0; }
    input {
      width: min(80%, 320px);
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      margin: 10px 0;
    }
    button {
      padding: 12px 22px;
      border: none;
      border-radius: 999px;
      background: #ff5d8f;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #f03c7b; }
    #w {
      color: #fff;
      font-weight: bold;
      min-height: 24px;
      margin-top: 12px;
    }
    audio {
      width: min(80%, 420px);
      margin: 10px 0 20px;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }
    .gallery img {
      width: min(42vw, 240px);
      height: 220px;
      object-fit: cover;
      border-radius: 14px;
      border: 3px solid rgba(255,255,255,0.7);
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
    }
    @media (max-width: 600px) {
      .gallery img {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <div id="login">
    <h2>Password 💌</h2>
    <input type="password" id="pass" placeholder="Enter password" />
    <br />
    <button type="button" onclick="check()">Unlock</button>
    <p id="w"></p>
  </div>

  <div id="main">
    <h1>Aditya 💖</h1>
    <p>Happy Boyfriend’s Day 😭❤️</p>

    <audio autoplay loop controls>
      <source src="assets/audio/song.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>

    <div class="gallery">
      <img src="assets/images/photo1.jpg" alt="Photo 1" />
      <img src="assets/images/photo2.jpg" alt="Photo 2" />
      <img src="assets/images/photo3.jpg" alt="Photo 3" />
      <img src="assets/images/photo4.jpg" alt="Photo 4" />
      <img src="assets/images/photo5.jpg" alt="Photo 5" />
    </div>
  </div>

  <script>
    const login = document.getElementById("login");
    const main = document.getElementById("main");
    const pass = document.getElementById("pass");
    const w = document.getElementById("w");

    function check() {
      if (pass.value === "2918") {
        login.style.display = "none";
        main.style.display = "block";
      } else {
        w.innerHTML = "Wrong 😭";
      }
    }
  </script>
</body>
</html>
